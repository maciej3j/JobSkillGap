[project]
name = "job_skill_gap"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maciej Kowalski", email = "maciej.ko1444@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobskillgap = "job_skill_gap.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["alembic"]

